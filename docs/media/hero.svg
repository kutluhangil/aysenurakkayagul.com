<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="A bilingual academic portfolio">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#f4f0ea}28%{fill:#3e3a4a}48%,80%{fill:#0d0c12}90%,100%{fill:#f4f0ea}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,8%{fill:#24212c}28%{fill:#f6f2ff}48%,80%{fill:#efebf7}90%,100%{fill:#24212c}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,8%{stroke:#24212c33}28%{stroke:#f6f2ff33}48%,80%{stroke:#efebf733}90%,100%{stroke:#24212c33}}
.panel{animation:panel 12s linear infinite}
@keyframes panel{0%,8%{fill:#24212c12}28%{fill:#f6f2ff12}48%,80%{fill:#efebf712}90%,100%{fill:#24212c12}}
.muted{opacity:.72}
.stars{animation:stars 12s linear infinite}
@keyframes stars{0%,8%{opacity:0}28%{opacity:.25}48%,80%{opacity:.9}90%,100%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.lit{filter:drop-shadow(0 0 4px currentColor)}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes grow{0%{transform:scaleY(.08)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
@keyframes draw{0%{stroke-dashoffset:700}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-700}}
@keyframes blink{50%{opacity:0}}
@keyframes feed{0%{transform:translateY(150px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slide{to{transform:translateX(100px)}}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes drop{0%,6%{transform:scaleY(0);opacity:0}16%,88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(0);opacity:0}}
@keyframes gauge{0%,10%{stroke-dashoffset:390}40%,85%{stroke-dashoffset:110}100%{stroke-dashoffset:390}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:skewX(-18deg) translateX(0)}60%,100%{transform:skewX(-18deg) translateX(788px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="1200" height="440" rx="28" fill="#f4f0ea"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2.4"><text class="ink muted" x="64" y="104">PORTFOLIO · REACT + R3F + FRAMER MOTION</text></g>
<text class="ink" x="60" y="200" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="78" letter-spacing="-1">Academic</text>
<text class="ink" x="60" y="282" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="78" letter-spacing="-1">Portfolio.</text>
<text class="ink muted" x="64" y="336" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="20">Research, teaching and talks, beautifully kept.</text>
<line class="rule" x1="64" y1="372" x2="1136" y2="372"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1.8">
  <text class="ink muted" x="64" y="404">TR / EN · DARK / LIGHT</text>
  <text class="ink muted" x="600" y="404" text-anchor="middle">IN-BROWSER PDF VIEWER</text>
  <text class="ink muted" x="1136" y="404" text-anchor="end">MARKDOWN NOTES</text>
</g>
<rect class="panel rule" x="652" y="92" width="488" height="262" rx="24"/>
<g class="stars"><circle cx="774.6" cy="170.3" r="1.7" fill="#fff" style="animation:tw 3.2s ease-in-out 0.8s infinite"/><circle cx="952" cy="185.8" r="1.4" fill="#fff" style="animation:tw 2.8s ease-in-out 1.2s infinite"/><circle cx="1032.5" cy="279.5" r="1.4" fill="#fff" style="animation:tw 3.7s ease-in-out 0s infinite"/><circle cx="902.8" cy="272.4" r="1" fill="#fff" style="animation:tw 2.5s ease-in-out 1.3s infinite"/><circle cx="907.4" cy="232.9" r="1.1" fill="#fff" style="animation:tw 2.2s ease-in-out 0s infinite"/><circle cx="788.1" cy="338.1" r="1.4" fill="#fff" style="animation:tw 2.7s ease-in-out 0.3s infinite"/><circle cx="823.8" cy="109.3" r="1.1" fill="#fff" style="animation:tw 2.5s ease-in-out 2s infinite"/><circle cx="953.6" cy="249.1" r="0.8" fill="#fff" style="animation:tw 3.9s ease-in-out 1.1s infinite"/><circle cx="769.6" cy="124.3" r="1.4" fill="#fff" style="animation:tw 3.6s ease-in-out 0.2s infinite"/><circle cx="741.6" cy="126.7" r="1.2" fill="#fff" style="animation:tw 2.3s ease-in-out 1s infinite"/><circle cx="729.6" cy="141.9" r="1.8" fill="#fff" style="animation:tw 2.7s ease-in-out 0.1s infinite"/><circle cx="948.8" cy="203.6" r="1.2" fill="#fff" style="animation:tw 1.7s ease-in-out 1s infinite"/><circle cx="740.8" cy="306.1" r="0.8" fill="#fff" style="animation:tw 2.7s ease-in-out 0.9s infinite"/><circle cx="792.5" cy="171.7" r="1.6" fill="#fff" style="animation:tw 2.1s ease-in-out 0.3s infinite"/><circle cx="1025.1" cy="312.6" r="1" fill="#fff" style="animation:tw 2.3s ease-in-out 0.9s infinite"/><circle cx="1090.2" cy="330.2" r="1" fill="#fff" style="animation:tw 3.7s ease-in-out 1.8s infinite"/><circle cx="1068.1" cy="222.8" r="1.1" fill="#fff" style="animation:tw 2.6s ease-in-out 0.1s infinite"/><circle cx="952.2" cy="148.2" r="1.4" fill="#fff" style="animation:tw 2s ease-in-out 1.2s infinite"/><circle cx="821.3" cy="317.5" r="1.1" fill="#fff" style="animation:tw 3.1s ease-in-out 1.6s infinite"/><circle cx="700.3" cy="230.8" r="0.8" fill="#fff" style="animation:tw 3s ease-in-out 1.1s infinite"/><circle cx="879.4" cy="286.1" r="1.4" fill="#fff" style="animation:tw 1.9s ease-in-out 1.6s infinite"/><circle cx="880.1" cy="335.3" r="1.9" fill="#fff" style="animation:tw 1.7s ease-in-out 1.8s infinite"/><circle cx="1108.2" cy="321.5" r="1.4" fill="#fff" style="animation:tw 2s ease-in-out 1.1s infinite"/><circle cx="921.9" cy="202.1" r="1.5" fill="#fff" style="animation:tw 2.2s ease-in-out 0.3s infinite"/><circle cx="967.1" cy="301.6" r="0.8" fill="#fff" style="animation:tw 3.5s ease-in-out 0.7s infinite"/><circle cx="997.7" cy="264.8" r="1.2" fill="#fff" style="animation:tw 2.4s ease-in-out 0.4s infinite"/></g>
<defs><radialGradient id="pl" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="#9b7bd4"/><stop offset="1" stop-color="#5fb3a1"/></radialGradient></defs>
<circle cx="896" cy="223" r="58" fill="#9b7bd4" fill-opacity=".18" class="pulse"/>
<circle cx="896" cy="223" r="40" fill="url(#pl)"/>
<ellipse cx="896" cy="223" rx="62" ry="10" fill="none" stroke="#e6b85c" stroke-width="3" stroke-opacity=".7" transform="rotate(-14 896 223)"/><g transform="rotate(-12 896 223)"><ellipse cx="896" cy="223" rx="200" ry="64" fill="none" stroke="#9b7bd4" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="6" fill="#9b7bd4" class="lit" style="color:#9b7bd4"><animateMotion dur="9s" repeatCount="indefinite" path="M 1096 223 A 200 64 0 1 1 696 223 A 200 64 0 1 1 1096 223"/></circle></g><g transform="rotate(18 896 223)"><ellipse cx="896" cy="223" rx="150" ry="46" fill="none" stroke="#e6b85c" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="5" fill="#e6b85c" class="lit" style="color:#e6b85c"><animateMotion dur="6s" repeatCount="indefinite" path="M 1046 223 A 150 46 0 1 1 746 223 A 150 46 0 1 1 1046 223"/></circle></g><g transform="rotate(-4 896 223)"><ellipse cx="896" cy="223" rx="100" ry="30" fill="none" stroke="#5fb3a1" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="4" fill="#5fb3a1" class="lit" style="color:#5fb3a1"><animateMotion dur="4.5s" repeatCount="indefinite" path="M 996 223 A 100 30 0 1 1 796 223 A 100 30 0 1 1 996 223"/></circle></g>
</svg>
